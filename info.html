<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Responsive Navbar with VHS Glitch Effect and Smooth Custom Cursor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---------------- NAVBAR ---------------- */
        .navbar {
            background-color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 40px;
            width: 100%;
            position: relative;
            z-index: 200;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .navbar ul {
            list-style-type: none;
            display: flex;
        }

        .navbar ul li {
            position: relative;
        }

        .navbar ul li a {
            text-decoration: none;
            color: black;
            padding: 10px 20px;
            display: block;
            position: relative;
            cursor: pointer;
        }

        .navbar ul li.active a {
            background-color: black;
            color: white;
        }

        .navbar ul li::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 100%;
            background-color: black;
            transition: width 0.4s ease;
            z-index: -1;
        }

        .navbar ul li:hover::before {
            width: 100%;
        }

        .navbar ul li a:hover {
            color: white;
        }

        .menu-icon {
            display: none;
            font-size: 28px;
            cursor: pointer;
        }

        .menu-icon span {
            display: block;
            width: 30px;
            height: 2px;
            background-color: black;
            margin: 5px 0;
            transition: all 0.5s ease;
        }

        @media (max-width: 800px) {
            .navbar ul {
                display: flex;
                flex-direction: column;
                position: absolute;
                top: 60px;
                right: -100%;
                background-color: #fff;
                width: 60%;
                min-height: 100vh;
                text-align: center;
                transition: right 0.5s ease;
                z-index: 100;
                box-shadow: -4px 0 15px rgba(0, 0, 0, 0.08);
            }

            .navbar ul li {
                display: block;
                margin: 10px 0;
            }

            .navbar ul.show {
                right: 0;
            }

            .menu-icon {
                display: block;
                z-index: 150;
            }

            .menu-icon.active span:nth-child(1) {
                transform: rotate(45deg) translate(5px, 5px);
            }

            .menu-icon.active span:nth-child(2) {
                opacity: 0;
            }

            .menu-icon.active span:nth-child(3) {
                transform: rotate(-45deg) translate(5px, -5px);
            }
        }

        /* ---------------- MAIN CONTAINER ---------------- */
      .container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex: 1;
    width: 90%;
    max-width: 1200px;
    background-color: #f1fbfb;
    margin: 0 auto;
    padding: 30px 20px;
    position: relative;
    perspective: 1600px;
    overflow: hidden;   /* NEW: container se bahar kuch na jaye */

}

        /* ---------------- IMAGE SIDE (stays fixed, never animates) ---------------- */
        .image-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .image-section img {
            max-width: 100%;
            width: 23rem;
            height: 23rem;
            object-fit: cover;
            position: relative;
            z-index: 2;
            border-radius: 6px;
            overflow: hidden;
        }

        .vhs-glitch {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 3;
        }

        .vhs-glitch::before,
        .vhs-glitch::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.1);
            animation: glitch-lines 0.15s infinite ease-in-out;
        }

        .vhs-glitch::before { top: 20%; }
        .vhs-glitch::after { top: 80%; animation-duration: 0.08s; animation-delay: 0.3s; }

        @keyframes glitch-lines {
            0% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0); }
        }

        /* ---------------- TEXT SIDE (this is the part that flips) ---------------- */
   .text-section {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
    overflow: hidden;
}

.text-flip-wrap {
    width: 100%;
    max-width: 480px;
    max-height: 340px;
 overflow-y: auto;
    padding-right: 6px;
        transform-style: preserve-3d;
    transform-origin: center center;
    backface-visibility: hidden;
}
.text-flip-wrap::-webkit-scrollbar {
    width: 5px;
}
.text-flip-wrap::-webkit-scrollbar-track {
    background: transparent;
}
.text-flip-wrap::-webkit-scrollbar-thumb {
    background-color: rgba(0, 0, 0, 0.25);
    border-radius: 10px;
}
.text-flip-wrap {
    scrollbar-width: thin;
    scrollbar-color: rgba(0,0,0,0.25) transparent;
}
        /* ---- Portfolio project cards ---- */
        .project-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin: 20px 0;
            max-height: 260px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .project-item {
            background-color: #ffffff;
            border: 1px solid #e2e2e2;
            border-radius: 8px;
            padding: 14px 16px;
            text-align: left;
        }

        .project-item h3 {
            font-size: 17px;
            color: #000;
            margin-bottom: 6px;
        }

        .project-item p {
            font-size: 14px;
            color: #8d8d8d;
            margin: 0 0 10px;
            line-height: 1.4;
        }

        .project-links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .project-links a {
            font-size: 13px;
            font-weight: 600;
            color: #000;
            text-decoration: none;
            border-bottom: 2px solid #000;
            padding-bottom: 2px;
            transition: opacity 0.2s ease;
        }

        .project-links a:hover {
            opacity: 0.6;
        }

        /* ---- Contact links ---- */
        .contact-links {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin: 10px 0 20px;
        }

        .contact-links a {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background-color: #000;
            text-decoration: none;
            padding: 12px 22px;
            border: 2px solid #000;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .contact-links a:hover {
            background: transparent;
            color: #000;
        }

        .text-inner h1 {
            font-family: sans-serif;
            font-weight: 800;
            text-transform: uppercase;
            color: #333;
            margin-bottom: 30px;
            font-size: 3rem;
            letter-spacing: 4px;
            position: relative;
        }

        .text-inner p {
            font-size: 20px;
            line-height: 1.6;
            color: #8d8d8d;
            margin: 10px 0 20px;
        }

        .text-inner span {
            font-size: 25px;
            color: #000;
            font-weight: 600;
        }

        .text-inner .btn {
            background-color: #000;
            color: white;
            padding: 18px 38px;
            cursor: pointer;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
            font-size: 16px;
            border: 2px solid black;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .text-inner .btn:hover {
            background: transparent;
            color: #000;
        }

        /* text swap animation for the flipping tagline on Home */
        .text-container {
            position: relative;
            display: inline-block;
            height: 1.6em;
            min-width: 220px;
            overflow: hidden;
        }

        .coder1, .coder2, .coder3 {
            font-size: 25px;
            font-weight: 600;
            color: #000;
            position: absolute;
            top: 10px;
            left: 0;
            transform-origin: bottom;
            opacity: 0;
            animation: flipText 9s infinite;
            white-space: nowrap;
        }

        .coder1 { animation-delay: 0s; }
        .coder2 { animation-delay: 3s; }
        .coder3 { animation-delay: 6s; }

        @keyframes flipText {
            0%, 33.33% { opacity: 0; transform: rotateX(-90deg); }
            38.88%, 61.11% { opacity: 1; transform: rotateX(0deg); }
            66.66%, 70% { opacity: 1; transform: rotateX(-45deg); }
            70%, 100% { opacity: 0; transform: rotateX(90deg); }
        }

        /* ---- Flip animations applied ONLY to .text-flip-wrap ---- */
        @keyframes flipTopToBottom {
            0%   { transform: rotateX(0deg); opacity: 1; }
            49%  { opacity: 0.2; }
            50%  { transform: rotateX(-90deg); opacity: 0.2; }
            51%  { opacity: 0.2; }
            100% { transform: rotateX(0deg); opacity: 1; }
        }

        @keyframes flipLeftToRight {
            0%   { transform: rotateY(0deg); opacity: 1; }
            49%  { opacity: 0.2; }
            50%  { transform: rotateY(90deg); opacity: 0.2; }
            51%  { opacity: 0.2; }
            100% { transform: rotateY(0deg); opacity: 1; }
        }

        @keyframes flipRightToLeft {
            0%   { transform: rotateY(0deg); opacity: 1; }
            49%  { opacity: 0.2; }
            50%  { transform: rotateY(-90deg); opacity: 0.2; }
            51%  { opacity: 0.2; }
            100% { transform: rotateY(0deg); opacity: 1; }
        }

        .flip-top-bottom { animation: flipTopToBottom 0.9s ease-in-out; }
        .flip-left-right { animation: flipLeftToRight 0.9s ease-in-out; }
        .flip-right-left { animation: flipRightToLeft 0.9s ease-in-out; }

        /* ---------------- FOOTER ---------------- */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            color: #000000;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
            padding: 20px 0;
            position: relative;
            flex-wrap: wrap;
            gap: 10px;
        }

        .copyRight {
            font-size: 15px;
        }

        .icons {
            display: flex;
            flex-direction: row;
            gap: 14px;
        }

        .icons a {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .icons i {
            font-size: 20px;
            color: #000;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .icons a:hover i {
            color: #666;
        }

         .cursor {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9999;
        }

        .cursor-dot {
            width: 6px;
            height: 6px;
            background-color: black;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
        }

        .cursor-circle {
            width: 30px;
            height: 30px;
            border: 2px solid rgb(167, 164, 164);
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease-out;
            /* Smooth movement */
        }

       

        /* ---------------- RESPONSIVE ---------------- */
        @media (max-width: 900px) {
            .text-inner h1 { font-size: 2.4rem; }
        }

        @media (max-width: 800px) {
           .container {
        height: auto;
        min-height: auto;
        flex-direction: column;
        padding: 30px 15px;
    }

            .image-section {
                order: 1;
                margin-bottom: 20px;
            }

            .image-section img {
                width: 16rem;
                height: 14rem;
            }

            .text-section {
                order: 2;
                width: 100%;
            }

           .text-flip-wrap {
        max-height: none;
        overflow-y: visible;
    }

            .text-inner h1 { font-size: 2.2rem; letter-spacing: 2px; }
            .text-inner p { font-size: 17px; }
            .text-container { margin: 0 auto; }
            .project-list { max-height: 180px; }
            .contact-links { justify-content: center; }
        }

        @media (max-width: 480px) {
            .navbar { padding: 10px 20px; }
            .logo { font-size: 20px; }
            .text-inner h1 { font-size: 1.7rem; }
            .text-inner p { font-size: 15px; }
            .text-inner .btn { padding: 14px 28px; font-size: 14px; }
            .image-section img { width: 12rem; height: 11rem; }
            .footer { flex-direction: column; text-align: center; }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">CODER</div>
        <ul id="navList">
            <li class="active"><a data-tab="home">Home</a></li>
            <li><a data-tab="about">About</a></li>
            <li><a data-tab="portfolio">Portfolio</a></li>
            <li><a data-tab="services">Services</a></li>
            <li><a data-tab="news">News</a></li>
            <li><a data-tab="contact">Contact</a></li>
        </ul>
        <div class="menu-icon" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <div class="container">
        <!-- Image side: never touched by flip animation, always stays put -->
        <div class="image-section">
            <img src="img.png" alt="Image">
            <div class="vhs-glitch"></div>
        </div>

        <!-- Text side: only this flips when a tab is clicked -->
        <div class="text-section">
            <div class="text-flip-wrap" id="textFlipWrap">
                <div class="text-inner" id="textInner">
                    <h1>MENUCODER</h1>
                    <p>Creative
                        <span class="text-container">
                            <span class="coder1">CODERS</span>
                            <span class="coder2">DEVELOPERS</span>
                            <span class="coder3">ENGINEERS</span>
                        </span>
                    </p>
                    <button class="btn">Click here</button>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <p class="copyRight">CopyRight &copy; 2026 Manahil Qamar. All rights reserved.</p>
        <div class="icons">
            <a href="#" target="_blank" rel="noopener" aria-label="Instagram"><i class='bx bxl-instagram-alt'></i></a>
            <a href="https://wa.me/923135153296" target="_blank" rel="noopener" aria-label="WhatsApp"><i class='bx bxl-whatsapp'></i></a>
            <a href="https://www.linkedin.com/in/manahil-qamar-41bb45323" target="_blank" rel="noopener" aria-label="LinkedIn"><i class='bx bxl-linkedin'></i></a>
            <a href="https://github.com/ManahilQamar" target="_blank" rel="noopener" aria-label="GitHub"><i class='bx bxl-github'></i></a>
        </div>
    </div>

    <!-- Custom Cursor -->
    <div class="cursor">
        <div class="cursor-dot"></div>
        <div class="cursor-circle"></div>
    </div>

    <script>
        // ---------------- Mobile menu ----------------
        function toggleMenu() {
            const menu = document.querySelector('.navbar ul');
            const menuIcon = document.querySelector('.menu-icon');
            menu.classList.toggle('show');
            menuIcon.classList.toggle('active');
        }
// ---------------- Lock container height to Home tab's natural size ----------------
window.addEventListener('load', () => {
    const container = document.querySelector('.container');
    if (window.innerWidth > 800) {
        const naturalHeight = container.offsetHeight;
        container.style.height = naturalHeight + 'px';
    }
});

window.addEventListener('resize', () => {
    const container = document.querySelector('.container');
    if (window.innerWidth > 800) {
        container.style.height = 'auto';
        const naturalHeight = container.offsetHeight;
        container.style.height = naturalHeight + 'px';
    } else {
        container.style.height = 'auto';
    }
});
        // ---------------- Tab content ----------------
        const tabContent = {
            home: {
                flip: null, // default state, no flip needed on load
                html: `
                    <h1>MENUCODER</h1>
                    <p>Creative
                        <span class="text-container">
                            <span class="coder1">CODERS</span>
                            <span class="coder2">DEVELOPERS</span>
                            <span class="coder3">ENGINEERS</span>
                        </span>
                    </p>
                    <button class="btn">Click here</button>
                `
            },
            about: {
                flip: 'flip-top-bottom',
                html: `
                    <h1>About Me</h1>
                    <p>I'm Manahil Qamar, a Full Stack Developer at Hizli-System and a BS Computer Science student at Virtual University of Pakistan. I'm also the founder of INHERBS, a herbal hair care brand. I love turning ideas into real, working products - from AI-powered study tools to WhatsApp automation for local businesses.</p>
                    <a class="btn" href="https://www.linkedin.com/in/manahil-qamar-41bb45323" target="_blank" style="display:inline-block; text-decoration:none; text-align:center;">Know More</a>
                `
            },
            portfolio: {
                flip: 'flip-left-right',
                html: `
                    <h1>My Work</h1>
                    <div class="project-list">
                        <div class="project-item">
                            <h3>VU Study App</h3>
                            <p>React + Node.js platform for VU BS CS students - MCQ practice, mock exams and AI-powered answer checking.</p>
                            <div class="project-links">
                                <a href="https://vu-study-app.vercel.app" target="_blank">Live Site</a>
                                <a href="https://github.com/ManahilQamar/vu-study-app" target="_blank">GitHub</a>
                            </div>
                        </div>
                        <div class="project-item">
                            <h3>Squid Game Project</h3>
                            <p>An interactive Squid Game inspired web project built with animations and custom UI.</p>
                            <div class="project-links">
                                <a href="https://manahilportfolio.netlify.app/squid/squid" target="_blank">Live Site</a>
                                <a href="https://github.com/ManahilQamar/Squid-Game.git" target="_blank">GitHub</a>
                            </div>
                        </div>
                        <div class="project-item">
                            <h3>INHERBS eCommerce</h3>
                            <p>Fully animated storefront for INHERBS, a herbal hair care brand - built end to end.</p>
                            <div class="project-links">
                                <a href="https://ecommerceab.netlify.app/" target="_blank">Live Site</a>
                            </div>
                        </div>
                    </div>
                    <a class="btn" href="https://github.com/ManahilQamar" target="_blank" style="display:inline-block; text-decoration:none; text-align:center;">More on GitHub</a>
                `
            },
            services: {
                flip: 'flip-right-left',
                html: `
                    <h1>Services</h1>
                    <p>Full stack web development, WhatsApp bot automation, AI-integrated applications and eCommerce storefronts - built end to end and tailored to what your business actually needs.</p>
                    <a class="btn" href="https://wa.me/923135153296" target="_blank" style="display:inline-block; text-decoration:none; text-align:center;">Get Started</a>
                `
            },
            news: {
                flip: 'flip-top-bottom',
                html: `
                    <h1>Latest News</h1>
                    <p>Currently building Digital Rasid - a WhatsApp-native udhaar (credit) tracking bot for small shopkeepers in Pakistan, powered by Node.js and the Groq API.</p>
                    <a class="btn" href="https://wa.me/923135153296" target="_blank" style="display:inline-block; text-decoration:none; text-align:center;">Read More</a>
                `
            },
            contact: {
                flip: 'flip-left-right',
                html: `
                    <h1>Get In Touch</h1>
                    <p>Have a project in mind? Let's talk about it - reach out on LinkedIn or WhatsApp and I'll get back to you.</p>
                    <div class="contact-links">
                        <a href="https://www.linkedin.com/in/manahil-qamar-41bb45323" target="_blank">LinkedIn</a>
                        <a href="https://wa.me/923135153296" target="_blank">WhatsApp</a>
                    </div>
                `
            }
        };

        const navLinks = document.querySelectorAll('#navList a');
        const textFlipWrap = document.getElementById('textFlipWrap');
        const textInner = document.getElementById('textInner');
        let currentTab = 'home';
        let isAnimating = false;

        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const tab = link.getAttribute('data-tab');
                if (tab === currentTab || isAnimating) return;

                // update active nav highlight
                navLinks.forEach(l => l.parentElement.classList.remove('active'));
                link.parentElement.classList.add('active');

                switchTab(tab);

                // close mobile menu after selecting a tab
                const menu = document.querySelector('.navbar ul');
                const menuIcon = document.querySelector('.menu-icon');
                menu.classList.remove('show');
                menuIcon.classList.remove('active');
            });
        });

        function switchTab(tab) {
            const data = tabContent[tab];
            if (!data) return;

            isAnimating = true;
            const flipClass = data.flip || 'flip-top-bottom';

            // remove any leftover animation classes first
            textFlipWrap.classList.remove('flip-top-bottom', 'flip-left-right', 'flip-right-left');
            // force reflow so the animation restarts cleanly
            void textFlipWrap.offsetWidth;
            textFlipWrap.classList.add(flipClass);

            // swap the actual text content at the halfway point of the flip
            setTimeout(() => {
                textInner.innerHTML = data.html;
            }, 450);

            textFlipWrap.addEventListener('animationend', function handler() {
                textFlipWrap.classList.remove(flipClass);
                textFlipWrap.removeEventListener('animationend', handler);
                isAnimating = false;
            });

            currentTab = tab;
        }

       // Custom Cursor Script
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorCircle = document.querySelector('.cursor-circle');
        let mouseX = 0;
        let mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function updateCursor() {
            // Move the dot
            cursorDot.style.left = `${mouseX}px`;
            cursorDot.style.top = `${mouseY}px`;

            // Move the circle with some delay
            const circleX = mouseX - cursorCircle.clientWidth / 2;
            const circleY = mouseY - cursorCircle.clientHeight / 2;
            cursorCircle.style.transform = `translate(${circleX}px, ${circleY}px)`;

            requestAnimationFrame(updateCursor);
        }

        updateCursor();
        
    </script>

</body>

</html>
